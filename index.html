<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CLI Flashcards — Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1116;
    --bg-elevated: #161b22;
    --bg-card: #1c232d;
    --border: #2a333f;
    --border-bright: #3d4a5c;
    --text: #e6e8eb;
    --text-dim: #8b97a8;
    --text-dimmer: #5a6575;
    --accent: #7ee787;
    --accent-dim: #3fb950;
    --amber: #e3b341;
    --blue: #79c0ff;
    --danger: #ff7b72;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: 'Fraunces', Georgia, serif;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
height: 100%;
background: var(–bg);
color: var(–text);
font-family: var(–mono);
font-size: 15px;
line-height: 1.5;
-webkit-font-smoothing: antialiased;
overscroll-behavior: none;
}

body {
background-image:
radial-gradient(circle at 20% 0%, rgba(126, 231, 135, 0.04) 0%, transparent 50%),
radial-gradient(circle at 80% 100%, rgba(227, 179, 65, 0.03) 0%, transparent 50%);
background-attachment: fixed;
padding: 24px 16px 32px;
min-height: 100vh;
display: flex;
flex-direction: column;
overflow-x: hidden;
}

.app {
max-width: 640px;
margin: 0 auto;
width: 100%;
flex: 1;
display: flex;
flex-direction: column;
}

header {
margin-bottom: 20px;
}

.brand {
display: flex;
align-items: baseline;
gap: 10px;
margin-bottom: 4px;
}

.prompt {
color: var(–accent);
font-weight: 600;
font-size: 13px;
}

.title {
font-family: var(–serif);
font-weight: 800;
font-size: 28px;
letter-spacing: -0.02em;
color: var(–text);
}

.title em {
font-style: italic;
font-weight: 400;
color: var(–accent);
}

.subtitle {
font-size: 12px;
color: var(–text-dim);
margin-top: 2px;
letter-spacing: 0.02em;
}

.controls {
display: flex;
gap: 8px;
margin-bottom: 16px;
flex-wrap: wrap;
}

.filter-group {
display: flex;
background: var(–bg-elevated);
border: 1px solid var(–border);
border-radius: 6px;
padding: 2px;
gap: 2px;
}

.filter-btn {
background: transparent;
border: none;
color: var(–text-dim);
font-family: var(–mono);
font-size: 12px;
font-weight: 500;
padding: 6px 10px;
border-radius: 4px;
cursor: pointer;
transition: color 0.15s ease, background 0.15s ease;
letter-spacing: 0.02em;
}

.filter-btn:hover {
color: var(–text);
}

.filter-btn.active {
background: var(–bg-card);
color: var(–accent);
box-shadow: inset 0 0 0 1px var(–border-bright);
}

.filter-btn.active[data-filter=“2”] { color: var(–amber); }
.filter-btn.active[data-filter=“3”] { color: var(–blue); }

.action-btn {
background: var(–bg-elevated);
border: 1px solid var(–border);
color: var(–text-dim);
font-family: var(–mono);
font-size: 12px;
font-weight: 500;
padding: 8px 14px;
border-radius: 6px;
cursor: pointer;
transition: all 0.15s ease;
display: inline-flex;
align-items: center;
gap: 6px;
letter-spacing: 0.02em;
}

.action-btn:hover {
color: var(–text);
border-color: var(–border-bright);
}

.action-btn:active {
transform: translateY(1px);
}

.progress {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 12px;
font-size: 11px;
color: var(–text-dimmer);
letter-spacing: 0.08em;
text-transform: uppercase;
}

.progress-bar {
flex: 1;
height: 2px;
background: var(–border);
margin: 0 12px;
position: relative;
overflow: hidden;
}

.progress-fill {
position: absolute;
top: 0;
left: 0;
height: 100%;
background: var(–accent);
transition: width 0.25s ease, background 0.25s ease;
}

.tier-badge {
display: inline-block;
font-size: 10px;
padding: 2px 6px;
border-radius: 3px;
letter-spacing: 0.1em;
font-weight: 600;
text-transform: uppercase;
margin-right: 8px;
}

.tier-1 {
background: rgba(126, 231, 135, 0.12);
color: var(–accent);
border: 1px solid rgba(126, 231, 135, 0.25);
}

.tier-2 {
background: rgba(227, 179, 65, 0.12);
color: var(–amber);
border: 1px solid rgba(227, 179, 65, 0.25);
}

.tier-3 {
background: rgba(121, 192, 255, 0.12);
color: var(–blue);
border: 1px solid rgba(121, 192, 255, 0.25);
}

/* CARD CONTAINER + SLIDE ANIMATION */
.card-wrap {
perspective: 1600px;
flex: 1;
min-height: 440px;
margin-bottom: 20px;
transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1),
opacity 0.3s ease;
will-change: transform, opacity;
}

.card-wrap.no-transition {
transition: none !important;
}

.card {
position: relative;
width: 100%;
height: 100%;
min-height: 440px;
transform-style: preserve-3d;
transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
cursor: pointer;
}

.card.flipped {
transform: rotateY(180deg);
}

.card-face {
position: absolute;
inset: 0;
background: var(–bg-card);
border: 1px solid var(–border);
border-radius: 12px;
padding: 28px 24px;
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
overflow-y: auto;
display: flex;
flex-direction: column;
box-shadow:
0 0 0 1px rgba(255,255,255,0.02),
0 20px 40px -20px rgba(0,0,0,0.5);
}

.card-face::-webkit-scrollbar { width: 4px; }
.card-face::-webkit-scrollbar-track { background: transparent; }
.card-face::-webkit-scrollbar-thumb { background: var(–border-bright); border-radius: 2px; }

.card-back {
transform: rotateY(180deg);
}

.card-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 20px;
padding-bottom: 14px;
border-bottom: 1px dashed var(–border);
}

.card-index {
font-size: 11px;
color: var(–text-dimmer);
letter-spacing: 0.08em;
text-transform: uppercase;
}

/* FRONT OF CARD */
.front-content {
flex: 1;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 20px 0;
}

.cmd-prompt-line {
color: var(–text-dimmer);
font-size: 14px;
margin-bottom: 8px;
font-weight: 500;
}

.cmd-name {
font-family: var(–mono);
font-size: 40px;
font-weight: 700;
letter-spacing: -0.02em;
color: var(–accent);
margin-bottom: 16px;
word-break: break-word;
}

.cmd-tagline {
font-family: var(–serif);
font-style: italic;
font-size: 18px;
color: var(–text-dim);
font-weight: 400;
max-width: 400px;
line-height: 1.4;
}

.flip-hint {
text-align: center;
font-size: 11px;
color: var(–text-dimmer);
letter-spacing: 0.12em;
text-transform: uppercase;
margin-top: auto;
padding-top: 20px;
}

/* BACK OF CARD */
.section {
margin-bottom: 18px;
}

.section:last-child {
margin-bottom: 0;
}

.section-label {
font-size: 10px;
color: var(–text-dimmer);
letter-spacing: 0.14em;
text-transform: uppercase;
margin-bottom: 6px;
font-weight: 600;
}

.section-body {
font-family: var(–serif);
font-size: 15px;
line-height: 1.55;
color: var(–text);
font-weight: 400;
}

.section-body code,
.flag-list code,
.example-box code {
font-family: var(–mono);
font-size: 13px;
background: rgba(126, 231, 135, 0.08);
color: var(–accent);
padding: 1px 5px;
border-radius: 3px;
border: 1px solid rgba(126, 231, 135, 0.12);
}

.flag-list {
display: flex;
flex-direction: column;
gap: 6px;
}

.flag-item {
font-family: var(–mono);
font-size: 13px;
color: var(–text-dim);
line-height: 1.5;
padding-left: 14px;
position: relative;
}

.flag-item::before {
content: ‘›’;
position: absolute;
left: 0;
color: var(–accent-dim);
}

.flag-item strong {
color: var(–amber);
font-weight: 600;
}

.example-box {
background: var(–bg);
border: 1px solid var(–border);
border-radius: 6px;
padding: 12px 14px;
font-family: var(–mono);
font-size: 13px;
line-height: 1.5;
overflow-x: auto;
color: var(–text);
}

.example-box .dollar {
color: var(–accent);
user-select: none;
margin-right: 8px;
}

.example-box code {
background: transparent;
border: none;
padding: 0;
color: var(–text);
font-size: 13px;
}

/* NAVIGATION */
.nav {
display: flex;
gap: 10px;
align-items: center;
}

.nav-btn {
flex: 1;
background: var(–bg-elevated);
border: 1px solid var(–border);
color: var(–text);
font-family: var(–mono);
font-size: 13px;
font-weight: 500;
padding: 14px;
border-radius: 8px;
cursor: pointer;
transition: all 0.15s ease;
letter-spacing: 0.02em;
touch-action: manipulation;
}

.nav-btn:hover:not(:disabled) {
border-color: var(–accent-dim);
color: var(–accent);
}

.nav-btn:active:not(:disabled) {
transform: translateY(1px);
}

.nav-btn:disabled {
opacity: 0.35;
cursor: not-allowed;
}

.nav-btn.flip {
flex: 0 0 auto;
padding: 14px 20px;
background: transparent;
}

footer {
margin-top: 20px;
font-size: 11px;
color: var(–text-dimmer);
text-align: center;
letter-spacing: 0.04em;
line-height: 1.6;
}

footer kbd {
font-family: var(–mono);
font-size: 10px;
background: var(–bg-elevated);
border: 1px solid var(–border);
border-radius: 3px;
padding: 1px 5px;
color: var(–text-dim);
}

@media (max-width: 480px) {
body { padding: 16px 12px 24px; }
.title { font-size: 24px; }
.cmd-name { font-size: 32px; }
.card-face { padding: 22px 18px; }
.controls { gap: 6px; }
.filter-btn { padding: 6px 9px; font-size: 11px; }
.action-btn { padding: 7px 10px; font-size: 11px; }
footer kbd { display: none; }
.footer-desktop { display: none; }
}

@media (min-width: 481px) {
.footer-mobile { display: none; }
}

@keyframes slideUp {
from { opacity: 0; transform: translateY(8px); }
to { opacity: 1; transform: translateY(0); }
}

.app { animation: slideUp 0.4s ease-out; }
</style>

</head>

<script>
  const cards = [
    // ====== TIER 1 ======
    {
      cmd: 'ls', tier: 1,
      tag: 'list directory contents',
      desc: 'Shows files and folders in a directory. The first command you run when exploring anywhere new.',
      flags: [
        '<strong>-l</strong> long format — permissions, owner, size, date',
        '<strong>-a</strong> all files — includes hidden (dotfiles)',
        '<strong>-h</strong> human-readable sizes (use with <code>-l</code>)',
        '<strong>-t</strong> sort by modification time, newest first',
        '<strong>-S</strong> sort by size'
      ],
      example: 'ls -lah /var/log'
    },
    {
      cmd: 'cd', tier: 1,
      tag: 'change directory',
      desc: 'Moves you around the filesystem. A few special targets are worth knowing.',
      flags: [
        '<strong>cd ~</strong> go to home directory (also just <code>cd</code>)',
        '<strong>cd -</strong> go to previous directory (great for toggling)',
        '<strong>cd ..</strong> go up one level',
        '<strong>cd ../..</strong> go up two levels'
      ],
      example: 'cd ~/projects/brandwatch'
    },
    {
      cmd: 'cat', tier: 1,
      tag: 'concatenate & print files',
      desc: 'Dumps a file to stdout. Great for small files, bad for huge ones — use <code>less</code> for those.',
      flags: [
        '<strong>-n</strong> number all lines',
        '<strong>-A</strong> show non-printing characters (tabs, line endings)',
        'Combine files: <code>cat a.txt b.txt > combined.txt</code>'
      ],
      example: 'cat /etc/passwd | grep bash'
    },
    {
      cmd: 'less', tier: 1,
      tag: 'paged file viewer',
      desc: 'Opens a file in a scrollable pager. Essential for anything over a few hundred lines.',
      flags: [
        '<strong>/pattern</strong> search forward · <strong>?pattern</strong> search back',
        '<strong>n</strong> next match · <strong>N</strong> previous match',
        '<strong>g</strong> go to start · <strong>G</strong> go to end',
        '<strong>q</strong> quit · <strong>space</strong> page down'
      ],
      example: 'less +F /var/log/syslog'
    },
    {
      cmd: 'head / tail', tier: 1,
      tag: 'show start or end of file',
      desc: 'Previews the top or bottom of a file. <code>tail -f</code> is essential for watching live logs.',
      flags: [
        '<strong>-n N</strong> show N lines (default 10)',
        '<strong>tail -f</strong> follow — print new lines as they arrive',
        '<strong>tail -F</strong> follow by name (survives log rotation)',
        '<strong>tail -n +20</strong> from line 20 onwards'
      ],
      example: 'tail -f -n 50 app.log'
    },
    {
      cmd: 'grep', tier: 1,
      tag: 'search text for patterns',
      desc: 'The workhorse of text search. Prints lines matching a pattern, from files or piped input.',
      flags: [
        '<strong>-i</strong> case-insensitive',
        '<strong>-v</strong> invert — show lines that do NOT match',
        '<strong>-r</strong> recursive through directories',
        '<strong>-E</strong> extended regex (use <code>|</code>, <code>+</code>, etc.)',
        '<strong>-c</strong> count matches · <strong>-n</strong> show line numbers',
        '<strong>-A 3 / -B 3 / -C 3</strong> context After/Before/around'
      ],
      example: "grep -rn 'ERROR' ./logs | grep -v HealthCheck"
    },
    {
      cmd: 'awk', tier: 1,
      tag: 'column-aware text processor',
      desc: 'Treats each line as fields. <code>$1</code>, <code>$2</code>… are columns; <code>$0</code> is the whole line. Separator defaults to whitespace.',
      flags: [
        '<strong>{print $N}</strong> print column N',
        '<strong>-F \',\'</strong> set field separator (e.g. CSV)',
        '<strong>condition { action }</strong> filter then act',
        '<strong>NR</strong> current line number · <strong>NF</strong> fields in line'
      ],
      example: "awk -F',' '$3 > 100 {print $1, $3}' data.csv"
    },
    {
      cmd: 'sed', tier: 1,
      tag: 'stream editor',
      desc: 'Transforms text as it flows. Most commonly used for find-and-replace with regex.',
      flags: [
        "<strong>'s/old/new/'</strong> substitute first match per line",
        "<strong>'s/old/new/g'</strong> global — all matches per line",
        '<strong>-i</strong> edit file in place (dangerous — back it up first)',
        "<strong>-n '5p'</strong> print line 5 only",
        "<strong>-e</strong> chain multiple expressions"
      ],
      example: "sed -i 's/localhost/prod-db/g' config.yml"
    },
    {
      cmd: 'cut', tier: 1,
      tag: 'extract columns by position',
      desc: 'Simpler than <code>awk</code> when you just need specific columns from delimited data.',
      flags: [
        "<strong>-d ','</strong> set delimiter",
        '<strong>-f 2</strong> select field 2 · <strong>-f 1,3</strong> fields 1 and 3',
        '<strong>-f 2-4</strong> fields 2 through 4',
        '<strong>-c 1-10</strong> characters 1 through 10 (no delimiter needed)'
      ],
      example: "cut -d':' -f1 /etc/passwd"
    },
    {
      cmd: 'sort', tier: 1,
      tag: 'sort lines',
      desc: 'Orders lines alphabetically by default. Almost always pipes into <code>uniq</code>.',
      flags: [
        '<strong>-n</strong> numeric sort (so 10 comes after 2)',
        '<strong>-r</strong> reverse order',
        '<strong>-k 2</strong> sort by field 2',
        '<strong>-u</strong> unique — dedupe while sorting',
        "<strong>-t ','</strong> set field separator"
      ],
      example: 'sort -rn -k 2 scores.txt | head'
    },
    {
      cmd: 'uniq', tier: 1,
      tag: 'filter adjacent duplicates',
      desc: 'Collapses adjacent identical lines. Almost always preceded by <code>sort</code>.',
      flags: [
        '<strong>-c</strong> prefix each unique line with its count',
        '<strong>-d</strong> show only duplicated lines',
        '<strong>-u</strong> show only lines that appear exactly once',
        '<strong>-i</strong> ignore case'
      ],
      example: "awk '{print $1}' access.log | sort | uniq -c | sort -rn | head"
    },
    {
      cmd: 'wc', tier: 1,
      tag: 'word, line, byte count',
      desc: 'Counts things. Most commonly used for counting lines in a file or pipe output.',
      flags: [
        '<strong>-l</strong> count lines (most common use)',
        '<strong>-w</strong> count words',
        '<strong>-c</strong> count bytes',
        '<strong>-m</strong> count characters (multi-byte aware)'
      ],
      example: "find . -name '*.py' | wc -l"
    },
    {
      cmd: 'find', tier: 1,
      tag: 'recursive file search',
      desc: 'Walks the filesystem applying filters. Can run commands on matches with <code>-exec</code>.',
      flags: [
        "<strong>-name 'pattern'</strong> match filename (quote it!)",
        '<strong>-type f/d/l</strong> files / dirs / symlinks',
        '<strong>-size +100M</strong> larger than · <strong>-size 1033c</strong> exact bytes',
        '<strong>-mtime -7</strong> modified in last 7 days',
        '<strong>! -executable</strong> negate any test',
        '<strong>-exec CMD {} +</strong> run command on results (fast)'
      ],
      example: "find . -type f -size 1033c ! -executable -exec cat {} +"
    },
    {
      cmd: 'xargs', tier: 1,
      tag: 'build commands from stdin',
      desc: 'Turns stdin lines into command arguments. Pairs beautifully with <code>find</code>.',
      flags: [
        '<strong>-I {}</strong> placeholder for substitution',
        '<strong>-0</strong> use null separator (with <code>find -print0</code>)',
        '<strong>-n 1</strong> one argument per invocation',
        '<strong>-P 4</strong> run 4 processes in parallel'
      ],
      example: "find . -name '*.tmp' -print0 | xargs -0 rm"
    },
    {
      cmd: 'chmod', tier: 1,
      tag: 'change file permissions',
      desc: 'Three digits: user, group, other. Each digit = read(4) + write(2) + execute(1).',
      flags: [
        '<strong>755</strong> rwxr-xr-x — typical for dirs and executables',
        '<strong>644</strong> rw-r--r-- — typical for regular files',
        '<strong>600</strong> rw------- — required for SSH private keys',
        '<strong>u+x</strong> symbolic: add execute for user',
        '<strong>-R</strong> recursive'
      ],
      example: 'chmod 600 ~/.ssh/id_rsa'
    },
    {
      cmd: 'chown', tier: 1,
      tag: 'change file ownership',
      desc: 'Changes owner and/or group. Often needs <code>sudo</code>.',
      flags: [
        '<strong>user</strong> just owner',
        '<strong>user:group</strong> owner and group',
        '<strong>:group</strong> just group',
        '<strong>-R</strong> recursive through directories'
      ],
      example: 'sudo chown -R www-data:www-data /var/www'
    },
    {

  // ============ STATE ============
  let currentIndex = 0;
  let currentFilter = 'all';
  let deck = [...cards];
  let isFlipped = false;
  let isAnimating = false;

  // ============ ELEMENTS ============
  const wrap = document.getElementById('cardWrap');
  const cardEl = document.getElementById('card');
  const cmdName = document.getElementById('cmdName');
  const cmdTagline = document.getElementById('cmdTagline');
  const cmdDesc = document.getElementById('cmdDesc');
  const cmdFlags = document.getElementById('cmdFlags');
  const cmdExample = document.getElementById('cmdExample');
  const tierBadgeFront = document.getElementById('tierBadgeFront');
  const tierBadgeBack = document.getElementById('tierBadgeBack');
  const cardIndexFront = document.getElementById('cardIndexFront');
  const cardIndexBack = document.getElementById('cardIndexBack');
  const position = document.getElementById('position');
  const total = document.getElementById('total');
  const progressFill = document.getElementById('progressFill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const flipBtn = document.getElementById('flipBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const resetBtn = document.getElementById('resetBtn');

  const SLIDE_DURATION = 280;
  const TIER_COLORS = { 1: '#7ee787', 2: '#e3b341', 3: '#79c0ff' };

  function pad(n) { return String(n).padStart(3, '0'); }

  // ============ RENDER ============
  function render() {
    const card = deck[currentIndex];
    if (!card) return;

    cmdName.textContent = card.cmd;
    cmdTagline.textContent = card.tag;
    cmdDesc.innerHTML = card.desc;
    cmdExample.textContent = card.example;

    cmdFlags.innerHTML = card.flags
      .map(f => `<div class="flag-item">${f}</div>`)
      .join('');

    const tierClass = `tier-${card.tier}`;
    const tierText = `TIER ${card.tier}`;
    tierBadgeFront.className = `tier-badge ${tierClass}`;
    tierBadgeFront.textContent = tierText;
    tierBadgeBack.className = `tier-badge ${tierClass}`;
    tierBadgeBack.textContent = tierText;

    // Tier-tinted accents
    cmdName.style.color = TIER_COLORS[card.tier];
    progressFill.style.background = TIER_COLORS[card.tier];

    const idx = `${pad(currentIndex + 1)} / ${pad(deck.length)}`;
    cardIndexFront.textContent = idx;
    cardIndexBack.textContent = idx;

    position.textContent = pad(currentIndex + 1);
    total.textContent = pad(deck.length);

    const pct = ((currentIndex + 1) / deck.length) * 100;
    progressFill.style.width = `${pct}%`;

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === deck.length - 1;
  }

  function flip() {
    if (isAnimating) return;
    isFlipped = !isFlipped;
    cardEl.classList.toggle('flipped', isFlipped);
  }

  function resetFlip() {
    if (isFlipped) {
      isFlipped = false;
      cardEl.classList.remove('flipped');
    }
  }

  // ============ SLIDE ANIMATION ============
  function setWrapTransform(x, opacity, instant = false) {
    if (instant) wrap.classList.add('no-transition');
    else wrap.classList.remove('no-transition');
    wrap.style.transform = `translateX(${x}px)`;
    wrap.style.opacity = String(opacity);
  }

  function resetWrap() {
    wrap.classList.remove('no-transition');
    wrap.style.transform = '';
    wrap.style.opacity = '';
  }

  function slideAndUpdate(direction, updateFn) {
    if (isAnimating) return;
    isAnimating = true;

    const screenW = window.innerWidth;
    const outX = direction === 'next' ? -screenW : screenW;
    const inFromX = direction === 'next' ? screenW : -screenW;

    resetFlip();
    setWrapTransform(outX, 0, false);

    setTimeout(() => {
      updateFn();
      setWrapTransform(inFromX, 0, true);
      void wrap.offsetHeight; // force reflow
      setWrapTransform(0, 1, false);

      setTimeout(() => {
        resetWrap();
        isAnimating = false;
      }, SLIDE_DURATION);
    }, SLIDE_DURATION);
  }

  function next() {
    if (isAnimating || currentIndex >= deck.length - 1) return;
    slideAndUpdate('next', () => { currentIndex++; render(); });
  }

  function prev() {
    if (isAnimating || currentIndex <= 0) return;
    slideAndUpdate('prev', () => { currentIndex--; render(); });
  }

  function shuffle() {
    if (isAnimating) return;
    resetFlip();
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    currentIndex = 0;

    // Little bounce feedback for shuffle
    isAnimating = true;
    wrap.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
    wrap.style.transform = 'scale(0.96)';
    wrap.style.opacity = '0.5';
    setTimeout(() => {
      render();
      wrap.style.transform = 'scale(1)';
      wrap.style.opacity = '1';
      setTimeout(() => {
        resetWrap();
        isAnimating = false;
      }, 180);
    }, 180);
  }

  function applyFilter(filter) {
    if (isAnimating) return;
    currentFilter = filter;
    resetFlip();
    if (filter === 'all') {
      deck = [...cards];
    } else {
      const t = parseInt(filter, 10);
      deck = cards.filter(c => c.tier === t);
    }
    currentIndex = 0;
    render();
  }

  function resetDeck() {
    if (isAnimating) return;
    applyFilter(currentFilter);
  }

  // ============ EVENT LISTENERS ============
  flipBtn.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(); });
  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
  shuffleBtn.addEventListener('click', shuffle);
  resetBtn.addEventListener('click', resetDeck);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter(btn.dataset.filter);
    });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === ' ') { e.preventDefault(); flip(); }
    else if (e.key === 's' || e.key === 'S') { shuffle(); }
  });

  // ============ TOUCH + CLICK HANDLING ============
  let touchStartX = 0;
  let touchStartY = 0;
  let touchMoved = false;
  let touchDragging = false;

  cardEl.addEventListener('touchstart', (e) => {
    if (isAnimating) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
    touchDragging = false;
  }, { passive: true });

  cardEl.addEventListener('touchmove', (e) => {
    if (isAnimating) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if (!touchDragging) {
      // Determine if this is a horizontal swipe (avoid hijacking vertical scroll)
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        touchDragging = true;
        touchMoved = true;
      } else if (Math.abs(dy) > 10) {
        return; // vertical scroll, let page handle it
      }
    }

    if (touchDragging) {
      // Follow finger, with rubber-band resistance at edges
      let effectiveDx = dx;
      if ((dx > 0 && currentIndex === 0) ||
          (dx < 0 && currentIndex === deck.length - 1)) {
        effectiveDx = dx * 0.35;
      }
      setWrapTransform(effectiveDx, Math.max(0.4, 1 - Math.abs(effectiveDx) / 500), true);
    }
  }, { passive: true });

  cardEl.addEventListener('touchend', (e) => {
    if (!touchDragging || isAnimating) {
      touchDragging = false;
      return;
    }

    const dx = e.changedTouches[0].clientX - touchStartX;
    const threshold = 70;
    const screenW = window.innerWidth;
    wrap.classList.remove('no-transition');

    if (dx < -threshold && currentIndex < deck.length - 1) {
      isAnimating = true;
      setWrapTransform(-screenW, 0, false);
      setTimeout(() => {
        resetFlip();
        currentIndex++;
        render();
        setWrapTransform(screenW, 0, true);
        void wrap.offsetHeight;
        setWrapTransform(0, 1, false);
        setTimeout(() => { resetWrap(); isAnimating = false; }, SLIDE_DURATION);
      }, SLIDE_DURATION);
    } else if (dx > threshold && currentIndex > 0) {
      isAnimating = true;
      setWrapTransform(screenW, 0, false);
      setTimeout(() => {
        resetFlip();
        currentIndex--;
        render();
        setWrapTransform(-screenW, 0, true);
        void wrap.offsetHeight;
        setWrapTransform(0, 1, false);
        setTimeout(() => { resetWrap(); isAnimating = false; }, SLIDE_DURATION);
      }, SLIDE_DURATION);
    } else {
      // Snap back to center
      setWrapTransform(0, 1, false);
      setTimeout(() => resetWrap(), SLIDE_DURATION);
    }

    touchDragging = false;
  });

  // Mouse/desktop click — flip card. Don't flip if a swipe just finished.
  cardEl.addEventListener('click', (e) => {
    if (touchMoved) {
      touchMoved = false;
      return;
    }
    if (e.target.closest('button')) return;
    flip();
  });

  // Initial render
  render();
</script>

</body>
</html>
